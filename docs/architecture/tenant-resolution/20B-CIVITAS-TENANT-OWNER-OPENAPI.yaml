        "x-civitas-idempotency": "not-required",
        "x-civitas-execution": "sync"
      }
    }
  },
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "description": "Core Manager / Owner authorization only."
      }
    },
    "headers": {
      "NoStore": {
        "description": "Respuesta privada no almacenable.",
        "schema": {
          "type": "string",
          "const": "private, no-store"
        }
      },
      "NoCache": {
        "description": "Compatibilidad con caches HTTP heredados.",
        "schema": {
          "type": "string",
          "const": "no-cache"
        }
      },
      "RequestId": {
        "description": "Correlación de soporte.",
        "schema": {
          "type": "string"
        }
      }
    },
    "parameters": {
      "OrganizationId": {
        "in": "path",
        "name": "organizationId",
        "required": true,
        "schema": {
          "type": "string"
        }
      },
      "HostnameId": {
        "in": "path",
        "name": "hostnameId",
        "required": true,
        "schema": {
          "type": "string"
        }
      },
      "RunId": {
        "in": "path",
        "name": "runId",
        "required": true,
        "schema": {
          "type": "string"
        }
      },
      "IdempotencyKey": {
        "in": "header",
        "name": "Idempotency-Key",
        "required": true,
        "schema": {
          "type": "string",
          "minLength": 16,
          "maxLength": 128
        }
      },
      "ReauthenticationToken": {
        "in": "header",
        "name": "X-Reauthentication-Token",
        "required": true,
        "schema": {
          "type": "string"
        }
      }
    },
    "responses": {
      "NeutralNotFound": {
        "description": "Espacio no encontrado.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "#/components/schemas/NeutralNotFoundProblem"
            }
          }
        },
        "headers": {
          "Cache-Control": {
            "$ref": "#/components/headers/NoStore"
          },
          "Pragma": {
            "$ref": "#/components/headers/NoCache"
          }
        }
      },
      "TenantLocked": {
        "description": "Organización no disponible para acceso.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "#/components/schemas/TenantLockedProblem"
            }
          }
        },
        "headers": {
          "Cache-Control": {
            "$ref": "#/components/headers/NoStore"
          },
          "Pragma": {
            "$ref": "#/components/headers/NoCache"
          }
        }
      },
      "NotFound": {
        "description": "Recurso Owner no encontrado.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "#/components/schemas/Problem"
            }
          }
        },
        "headers": {
          "Cache-Control": {
            "$ref": "#/components/headers/NoStore"
          },
          "Pragma": {
            "$ref": "#/components/headers/NoCache"
          }
        }
      },
      "Conflict": {
        "description": "Conflicto de estado o idempotencia.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "#/components/schemas/Problem"
            }
          }
        },
        "headers": {
          "Cache-Control": {
            "$ref": "#/components/headers/NoStore"
          },
          "Pragma": {
            "$ref": "#/components/headers/NoCache"
          }
        }
      },
      "ValidationFailed": {
        "description": "Validación fallida.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "#/components/schemas/Problem"
            }
          }
        },
        "headers": {
          "Cache-Control": {
            "$ref": "#/components/headers/NoStore"
          },
          "Pragma": {
            "$ref": "#/components/headers/NoCache"
          }
        }
      },
      "TenantHostMoved": {
        "description": "Hostname anterior; la mutación no se reenvía.",
        "headers": {
          "Cache-Control": {
            "$ref": "#/components/headers/NoStore"
          },
          "Pragma": {
            "$ref": "#/components/headers/NoCache"
          }
        },
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "#/components/schemas/TenantHostMovedProblem"
            }
          }
        }
      }
    },
    "schemas": {
      "Problem": {
        "type": "object",
        "required": [
          "type",
          "title",
          "status",
          "code"
        ],
        "properties": {
          "type": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "status": {
            "type": "integer"
          },
          "code": {
            "type": "string"
          },
          "detail": {
            "type": "string"
          },
          "requestId": {
            "type": "string"
          }
        }
      },
      "NeutralNotFoundProblem": {
        "allOf": [
          {
            "$ref": "#/components/schemas/Problem"
          },
          {
            "type": "object",
            "properties": {
              "title": {
                "const": "Espacio no encontrado"
              },
              "status": {
                "const": 404
              },
              "code": {
                "const": "TENANT_SPACE_NOT_FOUND"
              }
            }
          }
        ]
      },
      "TenantLockedProblem": {
        "allOf": [
          {
            "$ref": "#/components/schemas/Problem"
          },
          {
            "type": "object",
            "properties": {
              "title": {
                "const": "Contacte al administrador de su organización"
              },
              "status": {
                "const": 423
              },
              "code": {
                "const": "TENANT_LOCKED"
              }
            }
          }
        ]
      },
      "TenantSlug": {
        "type": "string",
        "minLength": 3,
        "maxLength": 63,
        "pattern": "^[a-z0-9](?:[a-z0-9-]{1,61})[a-z0-9]$"
      },
      "HostnameStatus": {
        "type": "string",
        "enum": [
          "reserved",
          "active",
          "redirecting",
          "retired",
          "blocked"
        ]
      },
      "OrganizationStatus": {
        "type": "string",
        "enum": [
          "provisioning",
          "active",
          "restricted_active",
          "suspended",
          "deactivated"
        ]
      },
      "TenantContextEnvelope": {
        "type": "object",
        "required": [
          "status",
          "tenant"
        ],
        "properties": {
          "status": {
            "const": "active"
          },
          "tenant": {
            "$ref": "#/components/schemas/TenantContext"
          }
        }
      },
      "TenantContext": {
        "type": "object",
        "required": [
          "organizationId",
          "tenantSlug",
          "hostname",
          "hostnameId",
          "hostnameStatus",
          "organizationStatus",
          "accessMode",
          "contextVersion",
          "resolvedAt",
          "requestId"
        ],
        "properties": {
          "organizationId": {
            "type": "string"
          },
          "tenantSlug": {
            "$ref": "#/components/schemas/TenantSlug"
          },
          "hostname": {
            "type": "string",
            "pattern": "^[a-z0-9](?:[a-z0-9-]{1,61})[a-z0-9]\\.portal\\.didaxus\\.com$"
          },
          "hostnameId": {
            "type": "string"
          },
          "hostnameStatus": {
            "const": "active"
          },
          "organizationStatus": {
            "type": "string",
            "enum": [
              "active",
              "restricted_active"
            ]
          },
          "accessMode": {
            "type": "string",
            "enum": [
              "full",
              "restricted"
            ]
          },
          "contextVersion": {
            "type": "integer",
            "minimum": 1
          },
          "resolvedAt": {
            "type": "string",
            "format": "date-time"
          },
          "requestId": {
            "type": "string"
          }
        }
      },
      "TenantSession": {
        "type": "object",
        "required": [
          "sessionId",
          "organizationId",
          "hostnameId",
          "contextVersion",
          "expiresAt"
        ],
        "properties": {
          "sessionId": {
            "type": "string"
          },
          "organizationId": {
            "type": "string"
          },
          "hostnameId": {
            "type": "string"
          },
          "contextVersion": {
            "type": "integer"
          },
          "accessMode": {
            "type": "string",
            "enum": [
              "full",
              "restricted"
            ]
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "OrganizationHostname": {
        "type": "object",
        "required": [
          "id",
          "organizationId",
          "tenantSlug",
          "hostname",
          "status",
          "isPrimary",
          "contextVersion",
          "createdAt"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "organizationId": {
            "type": "string"
          },
          "tenantSlug": {
            "$ref": "#/components/schemas/TenantSlug"
          },
          "hostname": {
            "type": "string",
            "pattern": "^[a-z0-9](?:[a-z0-9-]{1,61})[a-z0-9]\\.portal\\.didaxus\\.com$"
          },
          "status": {
            "$ref": "#/components/schemas/HostnameStatus"
          },
          "isPrimary": {
            "type": "boolean"
          },
          "contextVersion": {
            "type": "integer",
            "minimum": 1
          },
          "redirectTargetHostnameId": {
            "type": [
              "string",
              "null"
            ]
          },
          "redirectExpiresAt": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "retiredAt": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "HostnameChangeRun": {
        "type": "object",
        "required": [
          "id",
          "organizationId",
          "oldHostnameId",
          "newTenantSlug",
          "status",
          "createdAt"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "organizationId": {
            "type": "string"
          },
          "oldHostnameId": {
            "type": "string"
          },
          "newHostnameId": {
            "type": [
              "string",
              "null"
            ]
          },
          "newTenantSlug": {
            "$ref": "#/components/schemas/TenantSlug"
          },
          "status": {
            "type": "string",
            "enum": [
              "draft",
              "validating",
              "approved",
              "executing",
              "redirecting",
              "completed",
              "blocked",
              "failed",
              "cancelled"
            ]
          },
          "redirectExpiresAt": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "failureCode": {
            "type": [
              "string",
              "null"
            ]
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "completedAt": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          }
        }
      },
      "ReservedTenantSlug": {
        "type": "object",
        "required": [
          "slug",
          "reason",
          "createdAt",
          "createdBy"
        ],
        "properties": {
          "slug": {
            "$ref": "#/components/schemas/TenantSlug"
          },
          "reason": {
            "type": "string"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "createdBy": {
            "type": "string"
          }
        }
      },
      "OwnerReason": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "reason"
        ],
        "properties": {
          "reason": {
            "type": "string",
            "minLength": 10,
            "maxLength": 500
          }
        }
      },
      "TenantHostMovedProblem": {
        "allOf": [
          {
            "$ref": "#/components/schemas/Problem"
          },
          {
            "type": "object",
            "required": [
              "canonicalHost"
            ],
            "properties": {
              "status": {
                "const": 409
              },
              "code": {
                "const": "TENANT_HOST_MOVED"
              },
              "canonicalHost": {
                "type": "string",
                "pattern": "^[a-z0-9](?:[a-z0-9-]{1,61})[a-z0-9]\\.portal\\.didaxus\\.com$"
              }
            }
          }
        ]
      },
      "TenantAuthorityMismatchProblem": {
        "allOf": [
          {
            "$ref": "#/components/schemas/Problem"
          },
          {
            "type": "object",
            "properties": {
              "status": {
                "const": 421
              },
              "code": {
                "const": "TENANT_AUTHORITY_MISMATCH"
              }
            }
          }
        ]
      }
    }
  }
}
