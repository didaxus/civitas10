{
  "openapi": "3.1.0",
  "info": {
    "title": "Civitas Tenant Resolution API",
    "version": "2.0.0",
    "description": "Vista combinada de referencia. La integración del repositorio usa 20A Tenant BFF y 20B Owner. El tenant BFF usa cookie host-only y CSRF; la superficie Owner usa bearer y capacidades Civitas."
  },
  "servers": [
    {
      "url": "/"
    }
  ],
  "security": [],
  "tags": [
    {
      "name": "Tenant Bootstrap"
    },
    {
      "name": "Tenant Session"
    },
    {
      "name": "Owner Hostnames"
    },
    {
      "name": "Hostname Change"
    },
    {
      "name": "Reserved Slugs"
    }
  ],
  "paths": {
    "/api/tenant/context": {
      "get": {
        "tags": [
          "Tenant Bootstrap"
        ],
        "operationId": "getTenantContext",
        "security": [],
        "description": "Resuelve el tenant desde el effectiveHost. No acepta slug, organizationId ni headers de selección de tenant.\n",
        "responses": {
          "200": {
            "description": "Tenant activo o restricted_active.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/NoStore"
              },
              "Pragma": {
                "$ref": "#/components/headers/NoCache"
              },
              "X-Request-Id": {
                "$ref": "#/components/headers/RequestId"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TenantContextEnvelope"
                }
              }
            }
          },
          "404": {
            "description": "Hostname desconocido, blocked, retired o tenant deactivated.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/NoStore"
              },
              "Pragma": {
                "$ref": "#/components/headers/NoCache"
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/NeutralNotFoundProblem"
                }
              }
            }
          },
          "423": {
            "description": "Organización provisioning o suspended.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/NoStore"
              },
              "Pragma": {
                "$ref": "#/components/headers/NoCache"
              },
              "Retry-After": {
                "schema": {
                  "type": "integer"
                }
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/TenantLockedProblem"
                }
              }
            }
          },
          "503": {
            "description": "Registry o dependencia crítica no disponible.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/NoStore"
              },
              "Pragma": {
                "$ref": "#/components/headers/NoCache"
              },
              "Retry-After": {
                "schema": {
                  "type": "integer"
                }
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          }
        },
        "x-civitas-module": "tenant-resolution",
        "x-civitas-capability": "public",
        "x-civitas-route-id": "tenant-resolution.getTenantContext",
        "x-civitas-action-id": "getTenantContext",
        "x-civitas-surface": "tenant-bff",
        "x-civitas-status": "planned",
        "x-civitas-permission": "public",
        "x-civitas-policies": [
          "effective-host"
        ],
        "x-civitas-audit": false,
        "x-civitas-idempotency": "not-required",
        "x-civitas-execution": "sync"
      }
    },
    "/api/auth/sign-in": {
      "post": {
        "tags": [
          "Tenant Session"
        ],
        "operationId": "startTenantSignIn",
        "security": [],
        "description": "Crea AuthTransaction ligada al hostname resuelto y devuelve la URL de autorización de Logto. No acepta hostname ni organizationId.\n",
        "requestBody": {
          "required": false,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "returnPath": {
                    "type": "string",
                    "pattern": "^/(?!/)[A-Za-z0-9/_?=&%.-]*$"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "AuthTransaction creada.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/NoStore"
              },
              "Pragma": {
                "$ref": "#/components/headers/NoCache"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "authorizationUrl",
                    "transactionExpiresAt"
                  ],
                  "properties": {
                    "authorizationUrl": {
                      "type": "string",
                      "format": "uri"
                    },
                    "transactionExpiresAt": {
                      "type": "string",
                      "format": "date-time"
                    }
                  }
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/NeutralNotFound"
          },
          "423": {
            "$ref": "#/components/responses/TenantLocked"
          }
        },
        "x-civitas-module": "tenant-resolution",
        "x-civitas-capability": "public",
        "x-civitas-route-id": "tenant-resolution.startTenantSignIn",
        "x-civitas-action-id": "startTenantSignIn",
        "x-civitas-surface": "tenant-bff",
        "x-civitas-status": "planned",
        "x-civitas-permission": "public",
        "x-civitas-policies": [
          "effective-host",
          "same-origin",
          "fetch-metadata",
          "content-type-allowlist"
        ],
        "x-civitas-audit": true,
        "x-civitas-idempotency": "not-required",
        "x-civitas-execution": "sync",
        "parameters": [
          {
            "in": "header",
            "name": "Origin",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uri"
            },
            "description": "Must exactly match the current tenant origin."
          },
          {
            "in": "header",
            "name": "Sec-Fetch-Site",
            "required": true,
            "schema": {
              "type": "string",
              "const": "same-origin"
            }
          }
        ]
      }
    },
    "/api/auth/handoff": {
      "post": {
        "tags": [
          "Tenant Session"
        ],
        "operationId": "consumeTenantAuthHandoff",
        "security": [],
        "description": "Consume un handoff de un solo uso emitido por auth-callback.didaxus.com. Establece la cookie __Host-civitas_session.\n",
        "requestBody": {
          "required": true,
          "content": {
            "application/x-www-form-urlencoded": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "handoff"
                ],
                "properties": {
                  "handoff": {
                    "type": "string",
                    "minLength": 32
                  }
                }
              }
            }
          }
        },
        "responses": {
          "303": {
            "description": "Sesión creada y redirección a una ruta interna allowlisted.",
            "headers": {
              "Location": {
                "schema": {
                  "type": "string"
                }
              },
              "Set-Cookie": {
                "description": "Cookie __Host-civitas_session host-only.",
                "schema": {
                  "type": "string"
                }
              },
              "Cache-Control": {
                "$ref": "#/components/headers/NoStore"
              },
              "Pragma": {
                "$ref": "#/components/headers/NoCache"
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ValidationFailed"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "410": {
            "description": "Handoff expirado o consumido.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/NoStore"
              },
              "Pragma": {
                "$ref": "#/components/headers/NoCache"
              }
            }
          }
        },
        "x-civitas-module": "tenant-resolution",
        "x-civitas-capability": "public",
        "x-civitas-route-id": "tenant-resolution.consumeTenantAuthHandoff",
        "x-civitas-action-id": "consumeTenantAuthHandoff",
        "x-civitas-surface": "tenant-bff",
        "x-civitas-status": "planned",
        "x-civitas-permission": "public",
        "x-civitas-policies": [
          "effective-host",
          "one-time-handoff",
          "exact-target-host",
          "atomic-consumption"
        ],
        "x-civitas-audit": true,
        "x-civitas-idempotency": "not-required",
        "x-civitas-execution": "sync"
      }
    },
