        "description": "Lee la sesión BFF mediante la cookie host-only __Host-civitas_session.",
        "x-civitas-module": "tenant-resolution",
        "x-civitas-capability": "org.tenant_session.read",
        "x-civitas-route-id": "tenant-resolution.getTenantSession",
        "x-civitas-action-id": "getTenantSession",
        "x-civitas-surface": "tenant-bff",
        "x-civitas-status": "planned",
        "x-civitas-permission": "org.tenant_session.read",
        "x-civitas-policies": [
