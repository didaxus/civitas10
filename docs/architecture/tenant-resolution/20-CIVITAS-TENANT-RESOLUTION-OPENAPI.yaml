      },
      "HostnameChangeRun": {
        "type": "object",
        "required": [
          "id",
          "organizationId",
          "oldHostnameId",
          "newTenantSlug",
          "status",
          "createdAt"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "organizationId": {
            "type": "string"
          },
          "oldHostnameId": {
            "type": "string"
          },
          "newHostnameId": {
            "type": [
              "string",
              "null"
            ]
          },
          "newTenantSlug": {
            "$ref": "#/components/schemas/TenantSlug"
          },
          "status": {
            "type": "string",
            "enum": [
              "draft",
              "validating",
              "approved",
              "executing",
              "redirecting",
              "completed",
              "blocked",
              "failed",
              "cancelled"
            ]
          },
          "redirectExpiresAt": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "failureCode": {
            "type": [
              "string",
              "null"
            ]
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "completedAt": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          }
        }
      },
      "ReservedTenantSlug": {
        "type": "object",
        "required": [
          "slug",
          "reason",
          "createdAt",
          "createdBy"
        ],
        "properties": {
          "slug": {
            "$ref": "#/components/schemas/TenantSlug"
          },
          "reason": {
            "type": "string"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "createdBy": {
            "type": "string"
          }
        }
      },
      "OwnerReason": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "reason"
        ],
        "properties": {
          "reason": {
            "type": "string",
            "minLength": 10,
            "maxLength": 500
          }
        }
      },
      "TenantHostMovedProblem": {
        "allOf": [
          {
            "$ref": "#/components/schemas/Problem"
          },
          {
            "type": "object",
            "required": [
              "canonicalHost"
            ],
            "properties": {
              "status": {
                "const": 409
              },
              "code": {
                "const": "TENANT_HOST_MOVED"
              },
              "canonicalHost": {
                "type": "string",
                "pattern": "^[a-z0-9](?:[a-z0-9-]{1,61})[a-z0-9]\\.portal\\.didaxus\\.com$"
              }
            }
          }
        ]
      },
      "TenantAuthorityMismatchProblem": {
        "allOf": [
          {
            "$ref": "#/components/schemas/Problem"
          },
          {
            "type": "object",
            "properties": {
              "status": {
                "const": 421
              },
              "code": {
                "const": "TENANT_AUTHORITY_MISMATCH"
              }
            }
          }
        ]
      }
    }
  }
}
